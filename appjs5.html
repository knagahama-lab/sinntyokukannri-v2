<script>
/* appjs4.html が約89K文字あり、GASのページ埋め込みで実行されなくなったため
   (旧v1で動作実績のある最大は約81K文字) 2分割した後半。 */
/* ============================================================
   RENDER: 基板管理（基板マスタ — カテゴリ別・パチンコ/スロット・仕様・価格・使用部品）
============================================================ */
function addBoardMaster(category){
  const model=(prompt(`追加する基板品番を入力してください（${BOARD_CATEGORY_DEFS.find(c=>c.key===category).label}）`)||'').trim();
  if(!model)return;
  _getPartsStock(model).category=category;
  saveToGAS();
  renderBoards();
}
function deleteBoardMaster(model){
  if(!confirm(`基板「${model}」の登録を削除しますか？（在庫・BOMも削除されます）`))return;
  delete state.partsStock[model];
  addLog(`基板マスタ削除: ${model}`);
  saveToGAS();
  renderBoards();
}

function _boardMasterRow(model,term){
  const ps=_getPartsStock(model);
  const bomCount=ps.bom.length;
  const bomTotal=ps.bom.reduce((s,r)=>s+(r.qty*r.unitPrice),0);
  return`
    <div class="table-wrap" style="margin-bottom:10px;">
      <div class="table-toolbar">
        <h2 style="${_hit(model,term)?'background:#fef9c3;':''}">${_esc(model)}</h2>
        <div>
          <button class="btn btn-sm" onclick="openDetailModal('board','${model}')">📇 図鑑で見る</button>
          <button class="btn btn-sm" style="color:var(--danger);" onclick="deleteBoardMaster('${model}')">削除</button>
        </div>
      </div>
      <div style="padding:12px 14px;display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;">
        <div>
          <label style="font-size:10px;color:var(--text-sub);display:block;">用途</label>
          <select onchange="updateBoardMasterField('${model}','machineType',this.value)" style="padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;">
            ${MACHINE_TYPE_OPTIONS.map(o=>`<option value="${o}"${ps.machineType===o?' selected':''}>${o||'（未設定）'}</option>`).join('')}
          </select>
        </div>
        <div style="flex:1;min-width:220px;">
          <label style="font-size:10px;color:var(--text-sub);display:block;">仕様・概要</label>
          <input value="${_esc(ps.spec)}" placeholder="例: VDP AG5 / CGROM 64G(HSS)" onchange="updateBoardMasterField('${model}','spec',this.value)"
            style="width:100%;padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;${_hit(ps.spec,term)?'background:#fef9c3;':''}">
        </div>
        <div>
          <label style="font-size:10px;color:var(--text-sub);display:block;">価格（新品単価）</label>
          <input type="number" value="${ps.price.new}" onchange="updatePartsStockField('${model}','price','new',this.value)"
            style="width:100px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;text-align:right;">円
        </div>
        <div style="display:flex;gap:8px;">
          <div style="text-align:center;"><div style="font-size:10px;color:var(--text-sub);">新品在庫</div><div style="font-size:14px;font-weight:700;">${ps.stock.new}</div></div>
          <div style="text-align:center;"><div style="font-size:10px;color:var(--text-sub);">リユース</div><div style="font-size:14px;font-weight:700;">${ps.stock.reuse}</div></div>
          <div style="text-align:center;"><div style="font-size:10px;color:var(--text-sub);">エコ</div><div style="font-size:14px;font-weight:700;">${ps.stock.eco}</div></div>
        </div>
      </div>
      <div style="padding:0 14px 14px;">
        <details style="margin-top:2px;">
          <summary style="cursor:pointer;font-size:11px;font-weight:600;color:var(--text-sub);">🔩 使用部品（BOM） ${bomCount}点 ／ 合計 ¥${bomTotal.toLocaleString('ja-JP')}</summary>
          <div style="margin-top:8px;">${_bomLeafHtml(model,term)}</div>
        </details>
      </div>
    </div>`;
}

function _boardMasterMatches(model,term){
  if(!term)return true;
  if(_hit(model,term))return true;
  const ps=_getPartsStock(model);
  if(_hit(ps.spec,term)||_hit(ps.machineType,term))return true;
  return ps.bom.some(r=>_hit(r.partNo,term)||_hit(r.name,term));
}

function renderBoards(){
  const searchEl=document.getElementById('boards-search');
  const term=(searchEl?searchEl.value:'').trim().toLowerCase();
  const cursorPos=searchEl?searchEl.selectionStart:null;
  const hadFocus=document.activeElement===searchEl;

  const allModels=Object.keys(state.partsStock);

  const sectionsHtml=BOARD_CATEGORY_DEFS.map(cat=>{
    const models=allModels.filter(m=>(state.partsStock[m].category||'')===cat.key && _boardMasterMatches(m,term));
    const rowsHtml=models.map(m=>_boardMasterRow(m,term)).join('');
    return _treeBranch(
      `${cat.key}_${cat.label} <span style="font-weight:400;color:var(--text-sub);">（${models.length}件）</span>`,
      rowsHtml||`<div style="color:var(--text-muted);font-size:11px;padding:8px 0;">登録なし</div>`
      +`<button class="btn btn-sm" style="margin-top:8px;" onclick="addBoardMaster('${cat.key}')">＋ ${cat.label}を追加</button>`,
      !!term
    );
  }).join('');

  const uncategorized=allModels.filter(m=>!(state.partsStock[m].category) && _boardMasterMatches(m,term));
  const uncategorizedHtml=uncategorized.length?_treeBranch(
    `未分類 <span style="font-weight:400;color:var(--text-sub);">（${uncategorized.length}件・機種管理から登録された品番など）</span>`,
    uncategorized.map(m=>_boardMasterRow(m,term)).join(''),!!term
  ):'';

  document.getElementById('page-boards').innerHTML=`
    <div class="page-heading"><div><h2>🔧 基板管理</h2><p>主制御基板(M)・液晶制御基板(D)・液晶IF基板(DE)・演出基板(E)・サブ制御基板(C) — パチンコ/スロット区分・仕様・価格・使用部品を品番単位で管理</p></div></div>
    <div class="filter-bar">
      <input id="boards-search" type="text" placeholder="🔍 品番・仕様・部品名で検索" value="${_esc(term)}" oninput="renderBoards()"
        style="flex:1;min-width:240px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;">
      <button class="btn btn-sm" onclick="importBoardMasterSeed()">📋 初期データ取込</button>
    </div>
    <div class="table-wrap"><div style="padding:14px;">${sectionsHtml}${uncategorizedHtml}</div></div>`;

  const newSearchEl=document.getElementById('boards-search');
  if(newSearchEl&&hadFocus){
    newSearchEl.focus();
    if(cursorPos!=null)newSearchEl.setSelectionRange(cursorPos,cursorPos);
  }
}

/* 基板マスタ 初期データ（ユーザー提供の一覧をもとに登録） */

function importBoardMasterSeed(){
  if(!confirm(`初期データ（${BOARD_MASTER_SEED.length}件の基板品番）を取込みますか？\n既存の在庫・BOMデータはそのまま保持され、用途・カテゴリのみ設定されます。`))return;
  let count=0;
  BOARD_MASTER_SEED.forEach(s=>{
    const ps=_getPartsStock(s.model);
    ps.category=s.category;
    if(s.machineType)ps.machineType=s.machineType;
    count++;
  });
  addLog(`🔧 基板マスタ初期データ取込: ${count}件`);
  saveToGAS(`基板マスタ初期データ取込: ${count}件`);
  showToast(`✅ 基板マスタ ${count}件を取込みました`);
  renderBoards();
}

/* ============================================================
   図鑑ビュー（機種管理・基板管理 共通の詳細モーダル）
   写真・メモ・PDF/Excel添付ファイルの入力に対応
============================================================ */
let detailState={type:null,id:null};

function _detailList(type){
  if(type==='machine')return [...MACHINES].map(m=>m.id).sort();
  if(type==='catalogModel')return Object.keys(state.catalogModels).sort();
  if(type==='catalogBoard')return Object.keys(state.catalogBoards).sort();
  return Object.keys(state.partsStock).sort();
}

function openDetailModal(type,id){
  detailState={type,id};
  document.getElementById('detail-modal').classList.add('open');
  _renderDetailModal();
}
function closeDetailModal(){
  document.getElementById('detail-modal').classList.remove('open');
}
function detailNav(dir){
  const list=_detailList(detailState.type);
  const idx=list.indexOf(detailState.id);
  if(idx<0)return;
  const next=(idx+dir+list.length)%list.length;
  detailState.id=list[next];
  _renderDetailModal();
}

function _renderDetailModal(){
  const {type,id}=detailState;
  const list=_detailList(type);
  const idx=list.indexOf(id);
  document.getElementById('detail-modal-position').textContent=idx>=0?`${idx+1} / ${list.length}`:'';
  if(type==='machine'){
    document.getElementById('detail-modal-title').textContent=`📇 機種図鑑 — ${id}`;
    document.getElementById('detail-modal-body').innerHTML=renderMachineDetailBody(id);
  }else if(type==='catalogModel'){
    document.getElementById('detail-modal-title').textContent=`📖 製品図鑑（機種） — ${id}`;
    document.getElementById('detail-modal-body').innerHTML=renderCatalogModelDetailBody(id);
  }else if(type==='catalogBoard'){
    document.getElementById('detail-modal-title').textContent=`📖 製品図鑑（基板） — ${id}`;
    document.getElementById('detail-modal-body').innerHTML=renderCatalogBoardDetailBody(id);
  }else{
    document.getElementById('detail-modal-title').textContent=`📇 基板図鑑 — ${id}`;
    document.getElementById('detail-modal-body').innerHTML=renderBoardDetailBody(id);
  }
}

function _photoBlock(photo,uploadHandlerAttr){
  return`
    <div style="flex-shrink:0;width:180px;">
      <div style="width:180px;height:180px;border-radius:10px;overflow:hidden;background:#f1f5f9;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;">
        ${photo&&photo.url?`<img src="${photo.url}" style="width:100%;height:100%;object-fit:cover;">`:`<span style="color:var(--text-muted);font-size:12px;">写真なし</span>`}
      </div>
      <label class="btn btn-sm" style="display:block;text-align:center;margin-top:6px;cursor:pointer;">
        📷 写真を${photo?'変更':'追加'}
        ${'<input type="file" accept="image/'+'*" style="display:none;" '+uploadHandlerAttr+'>'}
      </label>
    </div>`;
}

function _fileListBlock(files,label){
  const rows=files.map(f=>`<div style="display:flex;align-items:center;justify-content:space-between;font-size:11px;padding:3px 0;">
      <a href="${f.url}" target="_blank" style="color:var(--primary);text-decoration:none;">📄 ${_esc(f.fileName)}</a>
      <span style="color:var(--text-muted);">${f.uploadedAt||''}</span>
    </div>`).join('');
  return`<div style="font-size:11px;font-weight:700;margin-bottom:4px;">${label}（PDF・Excel等）</div>
    ${rows||'<div style="color:var(--text-muted);font-size:11px;">添付ファイルなし</div>'}`;
}

function renderMachineDetailBody(id){

  return`
    <div style="display:flex;gap:20px;flex-wrap:wrap;">
      ${_photoBlock(photo,`onchange="handleMachinePhotoUpload(event,'${id}')"`)}
      <div style="flex:1;min-width:280px;">
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;">
          <span style="font-size:20px;font-weight:700;">${id}</span>
          ${badgeHtml(state.statuses[id])}
        </div>
        <div style="font-size:12px;color:var(--text-sub);display:grid;grid-template-columns:auto 1fr;gap:4px 10px;">
          <span>担当者</span><span>${_esc(m.person)||'—'}</span>
          <span>適合</span><span>${_esc(m.compliance)||'—'}</span>
          <span>量産台数</span><span>${_esc(m.prodQty)||'—'}</span>
          <span>ROM</span><span>${_esc(m.rom)||'—'}</span>
          <span>量産出荷</span><span>${sc.prodShip||'—'}</span>
        </div>
      </div>
    </div>
    <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border);">
      <div style="font-size:12px;font-weight:700;margin-bottom:6px;">🧩 基板構成</div>
      ${boardsSummary}
    </div>
    ${hw?`<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">
      <div style="font-size:12px;font-weight:700;margin-bottom:6px;">⚙️ ハードウェア構成</div>
      <div style="font-size:11px;color:var(--text-sub);">主制御:${_esc(hw.mainBoard)||'—'} / 液晶制御:${_esc(hw.lcdBoard)||'—'} / 演出IF:${_esc(hw.effectIfBoard)||'—'}</div>
    </div>`:''}
    <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border);">
      <div style="font-size:12px;font-weight:700;margin-bottom:4px;">📝 メモ</div>
      <textarea onchange="updateMachineMemo('${id}',this.value)" rows="3"
        style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;font-size:12px;resize:vertical;">${_esc(state.notes[id])}</textarea>

      ${_fileListBlock(files,'📎 添付資料')}
      <label class="btn btn-sm" style="margin-top:8px;cursor:pointer;display:inline-block;">
        ＋ PDF/Excelを追加
        <input type="file" accept=".pdf,.xlsx,.xls,.doc,.docx" style="display:none;" onchange="handleDriveUpload(event,'${id}')">

  const ps=_getPartsStock(model);
  if(!ps)return`<div style="color:var(--text-muted);">基板が見つかりません</div>`;

  const files=_getBoardDriveFiles(model);

    <div style="display:flex;gap:20px;flex-wrap:wrap;">
      ${_photoBlock(photo,`onchange="handleBoardPhotoUpload(event,'${model}')"`)}

        <div style="font-size:20px;font-weight:700;margin-bottom:6px;">${_esc(model)}</div>
        <div style="font-size:12px;color:var(--text-sub);display:grid;grid-template-columns:auto 1fr;gap:4px 10px;">
          <span>カテゴリ</span><span>${_esc(ps.category)} ${catLabel}</span>
          <span>用途</span><span>${_esc(ps.machineType)||'（未設定）'}</span>
          <span>価格（新品）</span><span>¥${Number(ps.price.new||0).toLocaleString('ja-JP')}</span>

      <div style="font-size:12px;font-weight:700;margin-bottom:4px;">仕様・概要</div>
      <input value="${_esc(ps.spec)}" onchange="updateBoardMasterField('${model}','spec',this.value)"
        style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;font-size:12px;">
    </div>
    <div style="margin-top:12px;">
      <div style="font-size:12px;font-weight:700;margin-bottom:4px;">🔩 使用部品（BOM） ${ps.bom.length}点 ／ 合計 ¥${bomTotal.toLocaleString('ja-JP')}</div>
      ${_bomLeafHtml(model,'')}
    </div>
    <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border);">
      <div style="font-size:12px;font-weight:700;margin-bottom:4px;">📝 メモ</div>
      <textarea onchange="updateBoardMemo('${model}',this.value)" rows="3"
        style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;font-size:12px;resize:vertical;">${_esc(ps.memo)}</textarea>

      </label>
    </div>`;
}

function updateMachineMemo(id,value){
  state.notes[id]=value;
  const m=MACHINES.find(x=>x.id===id);
  if(m)m.notes=value;
  saveToGAS();
  addLog(`メモ更新: ${id}`);
}
function updateBoardMemo(model,value){
  _getPartsStock(model).memo=value;
  saveToGAS();
  addLog(`基板メモ更新: ${model}`);
}

function _uploadPhoto(file,folderKey,onDone){
  if(file.size>20*1024*1024){showToast('⚠️ ファイルサイズは20MB以下にしてください');return;}
  showToast('📤 写真をアップロード中...');
  const reader=new FileReader();
  reader.onload=ev=>{
    const base64=ev.target.result.split(',')[1];
    if(typeof google!=='undefined'&&google.script){
      google.script.run
        .withSuccessHandler(res=>{
          try{
            const r=JSON.parse(res);
            if(r.success){onDone({fileId:r.fileId,fileName:r.fileName,url:r.url,uploadedAt:r.uploadedAt});showToast('✅ 写真を更新しました');}
            else showToast('⚠️ '+r.error);
          }catch(e){showToast('⚠️ レスポンスエラー');}
        })
        .withFailureHandler(err=>showToast('⚠️ '+err.message))
        .uploadFileToDrive(file.name,base64,file.type||'image/jpeg',folderKey);
    }else{showToast('⚠️ GAS環境でのみアップロード可能です');}
  };
  reader.readAsDataURL(file);
}

function handleMachinePhotoUpload(event,id){
  const file=event.target.files[0];if(!file)return;
  event.target.value='';
  _uploadPhoto(file,id,photo=>{
    state.machinePhotos[id]=photo;
    saveToGAS();
    if(detailState.type==='machine'&&detailState.id===id)_renderDetailModal();
  });
}
function handleBoardPhotoUpload(event,model){
  const file=event.target.files[0];if(!file)return;
  event.target.value='';
  _uploadPhoto(file,'board_'+model,photo=>{
    state.boardPhotos[model]=photo;
    saveToGAS();
    if(detailState.type==='board'&&detailState.id===model)_renderDetailModal();
  });
}

function handleBoardDriveUpload(event,model){
  const file=event.target.files[0];
  if(!file)return;
  event.target.value='';
  if(file.size>20*1024*1024){showToast('⚠️ ファイルサイズは20MB以下にしてください');return;}
  showToast('📤 アップロード中...');
  const reader=new FileReader();
  reader.onload=ev=>{
    const base64=ev.target.result.split(',')[1];
    if(typeof google!=='undefined'&&google.script){
      google.script.run
        .withSuccessHandler(res=>{
          try{
            const r=JSON.parse(res);
            if(r.success){
              _getBoardDriveFiles(model).push({fileId:r.fileId,fileName:r.fileName,url:r.url,uploadedAt:r.uploadedAt});
              saveToGAS();
              showToast('✅ アップロード完了: '+r.fileName);
              if(detailState.type==='board'&&detailState.id===model)_renderDetailModal();
            }else{showToast('⚠️ '+r.error);}
          }catch(e){showToast('⚠️ レスポンスエラー');}
        })
        .withFailureHandler(err=>showToast('⚠️ '+err.message))

  };

}

function _catalogPhotoBlock(entry,uploadFn){
  return`

function _uploadCatalogPhoto(file,onDone){
  if(file.size>20*1024*1024){showToast('⚠️ ファイルサイズは20MB以下にしてください');return;}
  showToast('📤 写真をアップロード中...');
  const reader=new FileReader();
  reader.onload=ev=>{
    const base64=ev.target.result.split(',')[1];
    if(typeof google!=='undefined'&&google.script){
      google.script.run
        .withSuccessHandler(res=>{
          try{
            const r=JSON.parse(res);
            if(r.success){onDone(r.url);showToast('✅ 写真を更新しました');}
            else showToast('⚠️ '+r.error);
          }catch(e){showToast('⚠️ レスポンスエラー');}
        })
        .withFailureHandler(err=>showToast('⚠️ '+err.message))
        .uploadFileToDrive(file.name,base64,file.type||'image/jpeg','catalog');
    }else{showToast('⚠️ GAS環境でのみアップロード可能です');}
  };
  reader.readAsDataURL(file);
}
function handleCatalogModelPhotoUpload(event,code){
  const file=event.target.files[0];if(!file)return;

function renderCatalog(){
  const searchEl=document.getElementById('catalog-search');
  const term=(searchEl?searchEl.value:'').trim().toLowerCase();
  const cursorPos=searchEl?searchEl.selectionStart:null;
  const hadFocus=document.activeElement===searchEl;

  const isModel=_catalogTab==='model';
  const entries=isModel?state.catalogModels:state.catalogBoards;
  const codes=Object.keys(entries).filter(code=>{
    if(!term)return true;
    const e=entries[code];
    return _hit(code,term)||_hit(e.name,term)||_hit(e.summary,term)||_hit(e.features||e.specs,term);
  }).sort();

  const rowsHtml=codes.map(code=>{
    const e=entries[code];
    return`<tr style="cursor:pointer;" onclick="openDetailModal('${isModel?'catalogModel':'catalogBoard'}','${code}')">
      <td>${e.photoUrl?`<img src="${_esc(e.photoUrl)}" style="width:36px;height:36px;object-fit:cover;border-radius:6px;">`:`<span style="color:var(--text-muted);font-size:11px;">—</span>`}</td>
      <td><strong>${_esc(code)}</strong></td>
      <td>${_esc(isModel?e.name:e.name)||'—'}</td>
      <td style="font-size:11px;color:var(--text-sub);">${isModel?_esc(e.type)||'—':_esc(e.category)||'—'}</td>
      <td style="font-size:11px;color:var(--text-sub);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${_esc(isModel?e.summary:e.specs)||'—'}</td>
      <td style="font-size:10.5px;color:var(--text-muted);">${e.updatedAt||'—'}</td>
    </tr>`;
  }).join('');

  document.getElementById('page-catalog').innerHTML=`
    <div class="page-heading"><div><h2>📖 製品図鑑</h2><p>機種・基板の特徴/仕様/学習メモをまとめるナレッジベース。実務の進捗・在庫データとは別に、社内教育や引き継ぎ用の情報を蓄積します。</p></div></div>
    <div style="display:flex;gap:8px;margin-bottom:14px;">
      <button class="btn btn-sm ${isModel?'btn-primary':''}" onclick="showCatalogTab('model')">🏭 機種図鑑（${Object.keys(state.catalogModels).length}）</button>
      <button class="btn btn-sm ${!isModel?'btn-primary':''}" onclick="showCatalogTab('board')">🔌 基板図鑑（${Object.keys(state.catalogBoards).length}）</button>
    </div>
    <div class="filter-bar">
      <input id="catalog-search" type="text" placeholder="🔍 コード・名称・概要で検索" value="${_esc(term)}" oninput="renderCatalog()"
        style="flex:1;min-width:240px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;">
      <button class="btn btn-sm btn-primary" onclick="${isModel?'addCatalogModel()':'addCatalogBoard()'}">＋ ${isModel?'機種':'基板'}を登録</button>
    </div>
    <div class="table-wrap"><div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;min-width:640px;">
      <thead><tr><th style="width:52px;"></th><th>コード</th><th>名称</th><th>${isModel?'種別':'分類'}</th><th>${isModel?'概要':'仕様'}</th><th>更新日</th></tr></thead>
      <tbody>${rowsHtml||`<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:24px;">登録がありません。「＋ 登録」から追加してください。</td></tr>`}</tbody>
    </table></div></div>`;

  const newSearchEl=document.getElementById('catalog-search');
  if(newSearchEl&&hadFocus){
    newSearchEl.focus();
    if(cursorPos!=null)newSearchEl.setSelectionRange(cursorPos,cursorPos);
  }
}



/* ============================================================
   値上げインパクト（部品原価改定 → 基板 → 機種別・利益低下）
   ※ 基板【改定前】202606〜シート および 機種別・基板マスタ表(GAS管理)
      から算出したスナップショットを静的データとして保持。
      最新化する場合はこの PRICE_IMPACT_DATA を差し替える。
============================================================ */
let PRICE_IMPACT_DATA = null;

function _yen(n){return "¥"+Math.round(n).toLocaleString("ja-JP");}
function _yenSigned(n){return (n<0?"-":"")+"¥"+Math.round(Math.abs(n)).toLocaleString("ja-JP");}

function renderPriceImpact(){
  if(!PRICE_IMPACT_DATA){
    document.getElementById('page-priceimpact').innerHTML=`
      <div class="page-heading"><div><h2>📉 値上げインパクト</h2><p>データを読み込み中...</p></div></div>`;
    if(typeof google!=='undefined'&&google.script){
      google.script.run
        .withSuccessHandler(function(data){PRICE_IMPACT_DATA=data;renderPriceImpact();})
        .withFailureHandler(function(err){
          document.getElementById('page-priceimpact').innerHTML=
            `<div class="alert-bar" style="background:#fef2f2;border-color:#fca5a5;color:#991b1b;">⚠️ データの読み込みに失敗しました: ${_esc(err&&err.message||'')}</div>`;
        })
        .getPriceImpactData();
    }else{
      document.getElementById('page-priceimpact').innerHTML=
        `<div class="alert-bar" style="background:#fef2f2;border-color:#fca5a5;color:#991b1b;">⚠️ GAS環境でのみ利用可能です。</div>`;
    }
    return;
  }
  const d=PRICE_IMPACT_DATA;
  const boardEntries=Object.entries(d.board_totals).sort((a,b)=>b[1]-a[1]);
  const maxBoard=boardEntries[0];
  const nonzeroMachines=d.machines.filter(m=>m.impact!==0).length;

  const boardRowsHtml=boardEntries.map(([board,amount])=>{
    const pct=(100*amount/maxBoard[1]).toFixed(1);
    const parts=d.parts_by_board[board]||[];
    const partsHtml=parts.length
      ? `<table style="width:100%;border-collapse:collapse;font-size:11.5px;margin-top:6px;">
          <thead><tr>
            <th style="text-align:left;padding:4px 8px;color:var(--text-sub);font-weight:700;">判明している値上げ部品</th>
            <th style="text-align:right;padding:4px 8px;color:var(--text-sub);font-weight:700;">単価UP額</th>
            <th style="text-align:right;padding:4px 8px;color:var(--text-sub);font-weight:700;">使用数/台</th>
            <th style="text-align:right;padding:4px 8px;color:var(--text-sub);font-weight:700;">基板原価への寄与</th>
          </tr></thead>
          <tbody>${parts.map(p=>`<tr>
            <td style="padding:4px 8px;border-top:1px dashed var(--border-light);">${_esc(p.part_name)}<br><span style="color:var(--text-muted);font-size:10.5px;">${_esc(p.part_code)}</span></td>
            <td style="padding:4px 8px;border-top:1px dashed var(--border-light);text-align:right;font-family:'IBM Plex Mono',monospace;">${_yenSigned(p.unit_cost_up)}</td>
            <td style="padding:4px 8px;border-top:1px dashed var(--border-light);text-align:right;font-family:'IBM Plex Mono',monospace;">${p.qty_per_board}</td>
            <td style="padding:4px 8px;border-top:1px dashed var(--border-light);text-align:right;font-family:'IBM Plex Mono',monospace;">${_yenSigned(p.board_cost_up)}</td>
          </tr>`).join('')}</tbody></table>`
      : `<div style="color:var(--text-muted);font-size:11px;padding:6px 0;">この基板に紐づく値上げ部品はまだ「基板【改定前】202606〜」シートに入力されていません（マスタ表の単価差額のみで、根拠となる部品明細は未確認）。</div>`;
    return _treeBranch(
      `<span style="font-family:'IBM Plex Mono',monospace;font-weight:700;">${_esc(board)}</span>
       <span style="display:inline-block;width:160px;height:10px;background:var(--border-light);border-radius:5px;overflow:hidden;vertical-align:middle;margin:0 10px;position:relative;top:-1px;">

  document.getElementById('page-priceimpact').innerHTML=`
    <div class="page-heading"><div><h2>📉 値上げインパクト</h2><p>部品の原価改定が基板・機種を経由して利益をどこまで削るかを追跡します（基板【改定前】202606〜シート ＋ 機種別・基板マスタ表 より算出）。</p></div></div>

    <div class="summary-grid">
      <div class="summary-card"><div class="lbl">全機種・合計コスト増加額(概算)</div><div class="val c-red">${_yen(d.grand_total)}</div><div class="sub">販売台数 × 基板単価改定前後差額の合計</div></div>
      <div class="summary-card"><div class="lbl">影響を受ける機種数</div><div class="val c-blue">${nonzeroMachines}<span style="font-size:13px;color:var(--text-sub);font-weight:500;"> / ${d.machines.length}</span></div><div class="sub">基板コード経由で影響が及ぶ機種</div></div>
      <div class="summary-card"><div class="lbl">最大インパクト基板</div><div class="val c-yellow">${_esc(maxBoard[0])}</div><div class="sub">全体の${(100*maxBoard[1]/d.grand_total).toFixed(1)}%（${_yen(maxBoard[1])}）</div></div>
    </div>

    <div class="alert-bar" style="background:#fffbeb;border-color:#fcd34d;color:#92400e;">
      ⚠️ 要確認: D2101A基板の単価がマスタ表で ¥743→¥8,513.29（約11.5倍）となっており、全体影響額の約65%を占めます。一方「基板【改定前】202606〜」シートで確認できる値上げ部品は1台あたり¥44分のみで、11.5倍を裏付ける根拠が見当たりません。マスタ表側のセル参照が壊れている可能性があるため、D2101Aの改定後単価セルを直接ご確認ください。
    </div>

    <div class="page-heading" style="margin-top:24px;"><div><h3 style="margin:0;font-size:14px;">基板別インパクト</h3><p>クリックすると、判明している値上げ部品の内訳を表示します。</p></div></div>
    <div class="table-wrap"><div style="padding:14px;">${boardRowsHtml}</div></div>

    <div class="page-heading" style="margin-top:24px;"><div><h3 style="margin:0;font-size:14px;">機種別インパクト・ランキング</h3><p>影響額が大きい機種順。主基板・払出基板・液晶制御(D)・演出基板(E)・液晶IF基板(DE)の5区分を合算。</p></div></div>
    <div class="table-wrap"><div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;min-width:560px;">
      <thead><tr><th>#</th><th>機種</th><th style="text-align:right;">販売台数</th><th style="text-align:right;">影響額(円)</th><th>主な要因基板</th></tr></thead>

}

function renderPage(page){
  if(page==='dashboard')renderHome();
  else if(page==='docs')renderDocs();
  else if(page==='csheets')renderConfigSheets();
  else if(page==='schedule')renderSchedule();
  else if(page==='eco')renderEco();
  else if(page==='flow')renderFlow();
  else if(page==='admin')renderAdmin();
  else if(page==='log')renderLog();
  else if(page==='future')renderFuturePage();
  else if(page==='parts')renderParts();
  else if(page==='boards')renderBoards();
  else if(page==='priceimpact')renderPriceImpact();
  else if(page==='catalog')renderCatalog();
}

/* ============================================================
   GAS INTEGRATION & INIT
============================================================ */
// Note: main saveToGAS with alertDesc is defined earlier above state
// This stub keeps backward compat for callers that pass no arg
function _saveToGASNoAlert(){
  saveToGAS();
}

function _init(saved){
  if(saved){
    try{
      const s=typeof saved==='string'?JSON.parse(saved):saved;
      if(s.statuses)Object.assign(state.statuses,s.statuses);
      if(s.schedules)Object.assign(state.schedules,s.schedules);
      if(s.notes)Object.assign(state.notes,s.notes);
      if(s.eco)Object.assign(state.eco,s.eco);
      if(s.config)Object.assign(state.config,s.config);
      if(s.customFlows)state.customFlows=s.customFlows;
      if(s.machineExtra)Object.assign(state.machineExtra,s.machineExtra);
      if(s.machineFields){
        Object.assign(state.machineFields,s.machineFields);
        Object.entries(s.machineFields).forEach(([id,f])=>{
          let m=MACHINES.find(x=>x.id===id);
          if(!m){
            m={id,person:'',compliance:'',prodQty:'',rom:'',
              sampleImpl:null,sampleAssy:null,sampleShip:null,prodImpl:null,prodAssy:null,prodShip:null,
              boards:[],notes:''};
            MACHINES.push(m);
            if(!state.statuses[id])state.statuses[id]='量産前';
            if(!state.schedules[id])state.schedules[id]={sampleImpl:null,sampleAssy:null,sampleShip:null,prodImpl:null,prodAssy:null,prodShip:null};
            if(!state.eco[id])state.eco[id]={collection:0,disassembly:0,e_inspect:0,snb_inspect:0,assembly:0,delivered:0,newParts:0};
          }
          Object.assign(m,f);
        });
      }
      if(s.deliveryDocs)Object.assign(state.deliveryDocs,s.deliveryDocs);
      if(s.milestones)Object.assign(state.milestones,s.milestones);
      if(s.futureModels)state.futureModels=s.futureModels;
      if(s.boardDocs)Object.assign(state.boardDocs,s.boardDocs);
      if(s.partsStock)Object.assign(state.partsStock,s.partsStock);
      if(s.hardwareSpecs)Object.assign(state.hardwareSpecs,s.hardwareSpecs);
      if(s.machinePhotos)Object.assign(state.machinePhotos,s.machinePhotos);
      if(s.boardPhotos)Object.assign(state.boardPhotos,s.boardPhotos);
      if(s.boardDriveFiles)Object.assign(state.boardDriveFiles,s.boardDriveFiles);
      if(s.catalogModels)Object.assign(state.catalogModels,s.catalogModels);
      if(s.catalogBoards)Object.assign(state.catalogBoards,s.catalogBoards);
      if(Array.isArray(s.importArchive))state.importArchive=s.importArchive;
      if(s.configSheets)state.configSheets=s.configSheets;
      if(s.driveFiles)Object.assign(state.driveFiles,s.driveFiles);
      if(s.linkageUrlOverrides)Object.assign(state.linkageUrlOverrides,s.linkageUrlOverrides);
      if(s.config&&s.config.tabSettings)Object.assign(state.config.tabSettings,s.config.tabSettings);
    }catch(e){}
  }
  updateEcoBadge();
  updateFutureBadge();
  applyTabSettings();
  renderDashboard();
  window._appInitialized=true; // 初期化完了後は、以降の実行時エラーで画面全体を潰さないようにする
}

(function(){
  var _diagEl=document.getElementById('diag-panel');
  function _diag(msg){
    console.log('[diag] '+msg);
    if(_diagEl){_diagEl.textContent+=new Date().toISOString().slice(11,19)+' '+msg+'\n';}
  }
  // ★ 起動方式: 本番(旧v1 build v9)で実績のある方式に統一。
  // メインJSはページに直接埋め込み(include)、保存データは window.load 後に
  // google.script.run.loadData() で取得する。
  // ※ 旧v1にあった「8秒応答なしなら空データで初期化」は、空stateの保存で
  //   実データを上書きする危険があるため廃止し、再試行のみ行う。
  var _initCalled=false;
  function _safeInit(saved,label){
    if(_initCalled)return;
    _initCalled=true;
    _diag('_init開始 ('+label+')');
    try{
      _init(saved);
      _diag('_init完了、renderDashboard実行済み');
    }catch(e){
      _diag('_init内でエラー: '+e.message);
      if(_diagEl){_diagEl.style.background='#7f1d1d';}
    }
  }
  var _loadAttempt=0;
  function _startLoad(){
    _loadAttempt++;
    if(typeof google==='undefined'||!google.script){
      _diag('google.scriptが存在しません(GAS外での表示)');
      _safeInit(null,'no-google-script');
      return;
    }
    _diag('loadData() 呼び出し中... (試行'+_loadAttempt+'回目)');
    var done=false;
    var timeoutId=setTimeout(function(){
      if(done||_initCalled)return;
      _diag('⚠️ 15秒応答なし。再試行します。');
      if(_loadAttempt<3){_startLoad();}
      else{
        _diag('3回とも応答なし。ページを再読み込みしてください。');
        if(_diagEl){_diagEl.style.background='#7f1d1d';}
      }
    },15000);
    google.script.run
      .withSuccessHandler(function(saved){done=true;clearTimeout(timeoutId);_diag('loadData成功 ('+(saved?saved.length:0)+'文字)');_safeInit(saved,'success');})
      .withFailureHandler(function(err){
        done=true;clearTimeout(timeoutId);
        _diag('loadData失敗: '+(err&&err.message));
        if(_loadAttempt<3){setTimeout(_startLoad,1000);}
        else if(_diagEl){_diagEl.style.background='#7f1d1d';}
      })
      .loadData();
  }
  // GASのサンドボックスは window.load 時点で postMessage 通信基盤が整うため、load後に呼ぶ
  if(document.readyState==='complete'){setTimeout(_startLoad,0);}
  else{window.addEventListener('load',_startLoad);}
})();






</script>
