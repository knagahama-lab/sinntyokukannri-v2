<script>
/* ============================================================
   シンプル画面（機種一覧 / 資料一覧 / 外部データ取り込み）
   メニューを「機種一覧・スケジュール・進捗状況・資料一覧」の4つに
   まとめた新レイアウト。既存データ(state / MACHINES)をそのまま使う。
   ※ このファイルにスラッシュ+アスタリスクを文字列で書かないこと
     （HtmlServiceのコメント誤認識の罠。Code.gs getAppBundle の注記参照）
============================================================ */
function _e6(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

const _PROG_STEPS=['sampleImpl','sampleAssy','sampleShip','prodImpl','prodAssy','prodShip'];

// 進行状況(%) = 6工程（見本機 実装/組立/出荷・量産 実装/組立/出荷）のうち
// 日付を過ぎた工程の割合。日程未入力の工程は未完了扱い。量産終了は100%。
function _machineProgress(m){
  if(state.statuses[m.id]==='量産終了')return 100;
  const sc=state.schedules[m.id]||{};
  return Math.round(_PROG_STEPS.filter(k=>sc[k]&&isPast(sc[k])).length/_PROG_STEPS.length*100);
}
function _machineDue(m){
  const sc=state.schedules[m.id]||{};
  return sc.prodShip||(state.milestones[m.id]||{}).goalDate||sc.sampleShip||'';
}
// 表示用ステータス: 期限超過 > 納期直前 > 登録ステータス
function _machineStatus(m,alerts){
  if(alerts.some(a=>a.machineId===m.id&&a.urgent))return{label:'期限超過',cls:'st-red'};
  const due=_machineDue(m);
  if(state.statuses[m.id]!=='量産終了'&&isNear(due))return{label:'納期直前',cls:'st-yellow'};
  const s=state.statuses[m.id]||'量産前';
  return{label:s,cls:s==='量産中'?'st-blue':s==='量産終了'?'st-green':'st-gray'};
}
function _boardHasDocs(machineId,model){
  if(_getBoardDriveFiles(model).length)return true;
  const d=state.boardDocs[machineId];
  if(d&&BOARD_TYPE_DEFS.some(bt=>d[bt.key]&&d[bt.key].model===model&&(d[bt.key].specUrl||d[bt.key].pcbUrl)))return true;
  const ps=state.partsStock[model];
  return !!(ps&&ps.bom&&ps.bom.length);
}
function _ring(p){
  const r=14,c=2*Math.PI*r,col=p>=100?'#16a34a':p>=50?'#2563eb':'#0891b2';
  return `<div class="ring"><svg width="36" height="36" viewBox="0 0 36 36"><circle cx="18" cy="18" r="${r}" fill="none" stroke="#e2e8f0" stroke-width="4"/>
    <circle cx="18" cy="18" r="${r}" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round"
      stroke-dasharray="${(c*p/100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 18 18)"/></svg><span>${p}%</span></div>`;
}

/* ---------- 機種一覧（トップ） ---------- */
// 起動時や各所の更新処理は renderDashboard() を直接呼ぶため、新画面へ差し替える
// （後から読み込まれるこのファイルの宣言が appjs2 の同名関数を上書きする）
function renderDashboard(){renderHome();}

// 「今やること」: 期限超過・7日以内の日程・14日以内の期限・生産計画取込
function _homeTodo(alerts,csTodo){
  const t=[];
  alerts=(alerts||[]).filter(a=>_custMatch(_machineCust(a.machineId)));
  (csTodo||[]).slice(0,8).forEach(x=>t.push({c:x.s.label==='依頼期限超過'?'st-red':'st-yellow',
    txt:`📑 ${_dispKey(x.key)} ${x.kind.label}構成表 ${x.s.label==='依頼期限超過'?'依頼期限超過':'依頼期限 '+x.s.due}`,
    act:`openCsEditor('${_e6(x.key)}','${x.kind.k}')`}));
  if((csTodo||[]).length>8)t.push({c:'st-yellow',txt:`📑 ほか構成表 ${csTodo.length-8}件`,act:`showPage('csheets')`});
  alerts.filter(a=>a.urgent).forEach(a=>t.push({c:'st-red',txt:`🚨 ${a.machineId} ${a.label}（期限超過）`,act:`openEditModal('${_e6(a.machineId)}')`}));
  _custMachines().forEach(m=>{const sc=state.schedules[m.id]||{};
    [['sampleShip','見本機出荷'],['prodImpl','量産実装'],['prodAssy','量産組立'],['prodShip','量産出荷']].forEach(([k,l])=>{
      if(isNear(sc[k])){const d=getDiff(sc[k]);t.push({c:'st-yellow',txt:`⚠️ ${m.id} ${l}（${d===0?'本日':d+'日後'}）`,act:`showPage('schedule')`});}});});
  alerts.filter(a=>!a.urgent).forEach(a=>t.push({c:'st-yellow',txt:`⏰ ${a.machineId} ${a.label}（あと${a.diff}日）`,act:`openEditModal('${_e6(a.machineId)}')`}));
  const li=state.config.lastSunDenshiImportAt, ds=li?Math.floor((todayD-new Date(li))/86400000):null;
  if(!li||ds>35)t.push({c:'st-gray',txt:`📊 生産計画Excelの月次取込（${li?ds+'日経過':'未取込'}）`,act:`openImportModal()`});
  if(typeof _mtTodoStrip==='function')_mtTodoStrip().forEach(x=>t.unshift(x));
  if(!t.length)return '';
  return `<div class="todo-strip"><strong style="font-size:12px;margin-right:4px;">今やること</strong>${t.map(x=>`<span class="st ${x.c}" style="cursor:pointer;" onclick="${x.act}">${_e6(x.txt)}</span>`).join('')}</div>`;
}

/* ---------- 一覧表の共通部品（見積管理「価格一覧表」と同じ表スタイル） ---------- */
function _ptCsvDownload(name,headers,rows){
  const q=v=>{const s=String(v==null?'':v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const csv='﻿'+[headers].concat(rows).map(r=>r.map(q).join(',')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download=name+'_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a);a.click();a.remove();
}
function _ptPrint(title,wrapId){
  const el=document.getElementById(wrapId); if(!el)return;
  const css=[...document.querySelectorAll('style')].map(s=>s.textContent).join('\n');
  const w=window.open('','_blank'); if(!w){showToast('⚠️ ポップアップがブロックされました');return;}
  w.document.write(`<html><head><meta charset="utf-8"><title>${_e6(title)}</title><style>${css}
    body{background:#fff;padding:10px;font-family:sans-serif;} .pt-wrap{max-height:none;overflow:visible;border:none;}
    table.pt thead th{position:static;} @page{size:A4 landscape;margin:8mm;}</style></head>
    <body><h3 style="margin:0 0 6px;">${_e6(title)}</h3>${el.outerHTML}</body></html>`);
  w.document.close();setTimeout(()=>w.print(),300);
}
function _ptChip(label,n,on,act){return `<button class="pt-chip${on?' on':''}" onclick="${act}">${label}<b>${n}</b></button>`;}
// 基板品番 → 区分（M/D/DE/E/C）
function _boardCat(model){
  const s=String(model||'').replace(/^FJ\+/,'');
  if(/^DE/.test(s))return 'DE';
  if(/^(D|SNB|AXB|AG)/.test(s))return 'D';
  if(/^M/.test(s))return 'M';
  if(/^E/.test(s))return 'E';
  if(/^C/.test(s))return 'C';
  return '';
}
function _rowBoards(r){
  const o={};
  const db=r.db||{};const hw=db.hw||{};
  const ov=((state.modelOverrides||{})[r.key]||{}).boards||{};
  Object.entries(ov).forEach(([c,v])=>{if(v)o[c]=v;});
  if(r.m)(r.m.boards||[]).forEach(b=>{const c=_boardCat(b.model);if(c&&!o[c])o[c]=b.model;});
  Object.entries(db.boards||{}).forEach(([c,v])=>{if(v&&!/^不要/.test(v)&&!o[c])o[c]=v;});
  [['M','mainBoard'],['D','lcdBoard'],['DE','lcdIfBoard'],['E','effectIfBoard']].forEach(([c,f])=>{if(!o[c]&&hw[f])o[c]=hw[f];});
  return o;
}
function _rowKind(r){
  const db=r.db||{};
  if(db.kind)return db.kind;
  if(r.m&&/^[A-D]\d/.test(r.key))return 'パチンコ';
  if(r.m&&/^(E|NA)\d/.test(r.key))return 'スロット';
  return 'その他';
}

/* ---------- 機種一覧（トップ） ---------- */
let _homeStatus='', _homeTerm='', _homeScope='active', _homeKind='', _homeCsOnly=false, _homeRegOnly=false, _homeLimit=200;
function _homeData(){
  const all=typeof _modelRows==='function'?_modelRows(_homeScope):MACHINES.map(m=>({key:m.id,m,db:null}));
  const alerts=getMilestoneAlerts();
  return all.map(r=>{
    const db=r.db||{};const ll=db.longlead||{};
    let st,due,prog='';
    if(r.m){st=_machineStatus(r.m,alerts);due=db.salesDate||ll.deliveryDate||_machineDue(r.m)||'';prog=_machineProgress(r.m)+'%';}
    else{due=db.salesDate||ll.deliveryDate||'';st=due&&due<_todayStr()?{label:'販売済',cls:'st-green'}:{label:'計画',cls:'st-gray'};}
    const cs=typeof _csState==='function'?CS_KINDS.map(x=>({x,s:_csState(r.key,x.k)})):[];
    return Object.assign({},r,{cust:r.cust||'fuji',kind:_rowKind(r),title:db.title||'',person:(r.m&&r.m.person)||db.person||'',due,agg:db.aggDate||'',
      qty:(db.forecast&&db.forecast.mid)?Number(db.forecast.mid).toLocaleString()+' *':(db.salesQty||ll.qty||(r.m?r.m.prodQty:'')||''),frame:db.frame||ll.frame||'',boards:_rowBoards(r),st,prog,cs,
      csAlert:cs.some(c=>c.s.label==='依頼期限超過'||c.s.label==='要依頼')});
  });
}
function renderHome(){
  if(typeof _loadModelDB==='function'&&!_mdbLoadStarted)_loadModelDB();
  if(typeof _renderCustSelect==='function')_renderCustSelect();
  const showC=_curCust()==='all';
  const alerts=getMilestoneAlerts();
  const data=_homeData();
  const term=_homeTerm.trim().toLowerCase();
  const base=data.filter(d=>(!term||(d.key+' '+d.title+' '+d.person+' '+Object.values(d.boards).join(' ')).toLowerCase().includes(term))
    &&(!_homeCsOnly||d.csAlert)&&(!_homeRegOnly||d.m));
  const kinds=['パチンコ','スロット','その他'];
  const corder=c=>_customers().findIndex(x=>x.id===c);
  // 状態での絞り込み（進行中 = 量産前・量産中・期限超過・納期直前）
  const ST_GROUPS={'進行中':['量産前','量産中','期限超過','納期直前'],'量産前':['量産前'],'量産中':['量産中'],'量産終了':['量産終了'],
    '期限超過・納期直前':['期限超過','納期直前'],'計画（機種DB）':['計画'],'販売済（機種DB）':['販売済']};
  const stPass=(d,g)=>!g||(ST_GROUPS[g]||[]).includes(d.st.label);
  const kindPass=d=>!_homeKind||d.kind===_homeKind;
  const list=base.filter(d=>kindPass(d)&&stPass(d,_homeStatus))
    .sort((a,b)=>(showC?corder(a.cust)-corder(b.cust):0)||kinds.indexOf(a.kind)-kinds.indexOf(b.kind)||String(a.due||'9999').localeCompare(String(b.due||'9999'))||a.key.localeCompare(b.key));
  window._homeList=list;

  const CM=_custMachines();
  const active=CM.filter(m=>state.statuses[m.id]==='量産中').length;
  const near=CM.filter(m=>state.statuses[m.id]!=='量産終了'&&isNear(_machineDue(m))).length;
  const csTodo=typeof _csTodo==='function'?_csTodo():[];
  const planned=data.filter(d=>!d.m&&d.due&&d.due>=_todayStr()).length;
  const openRow=d=>`openMachineEditor('${_e6(d.key)}')`;
  const fmt=v=>v?_e6(String(v).replace(/-/g,'/')):'<span class="same">—</span>';
  const BC=['M','D','DE','E','C'];
  const NC=13+BC.length+(showC?1:0);
  const secOf=d=>(showC?_custName(d.cust)+' ／ ':'')+d.kind;

  let body='',last='';
  list.slice(0,_homeLimit).forEach(d=>{
    if(secOf(d)!==last){last=secOf(d);body+=`<tr class="pt-sec"><td colspan="${NC}">■ ${_e6(last)}（${list.filter(x=>secOf(x)===last).length}機種）</td></tr>`;}
    body+=`<tr class="click" onclick="${openRow(d)}">
      <td class="name">${_e6(_dispKey(d.key))}${d.m?'<span class="pt-tag">登録</span>':''}</td>${showC?`<td>${_e6(_custName(d.cust))}</td>`:''}
      <td class="spec" title="${_e6(d.title)}">${_e6(d.title)||'<span class="same">—</span>'}</td>
      <td>${_e6(d.person)||'<span class="same">—</span>'}</td>
      <td class="c pt-cur">${fmt(d.due)}</td>
      <td class="c">${fmt(d.agg)}</td>
      <td class="num">${_e6(d.qty)||'<span class="same">—</span>'}</td>
      <td class="c">${_e6(d.frame)||'<span class="same">—</span>'}</td>
      ${BC.map(c=>`<td class="spec" style="max-width:110px;" title="${_e6(d.boards[c]||'')}">${_e6(d.boards[c]||'')||'<span class="same">—</span>'}</td>`).join('')}
      ${d.cs.map(c=>`<td class="c" onclick="event.stopPropagation()">${_csSelect(d.key,c.x.k,c.s)}</td>`).join('')}
      <td class="c"><span class="st ${d.st.cls}" style="padding:0 6px;">${_e6(d.st.label)}</span></td>
      <td class="num" style="font-weight:500;">${d.prog||'<span class="same">—</span>'}</td>
      <td class="c" onclick="event.stopPropagation()">${true?`<button class="btn btn-sm" style="padding:1px 8px;" onclick="openMachineEditor('${_e6(d.key)}')">編集</button>`:''}</td></tr>`;
  });
  const n=k=>base.filter(d=>(!k||d.kind===k)&&stPass(d,_homeStatus)).length;
  const ns=g=>base.filter(d=>kindPass(d)&&stPass(d,g)).length;
  const tree=list.slice(0,_homeLimit).map(d=>`<details class="tree-node" ${term?'open':''}>
      <summary><span class="tree-machine" onclick="event.preventDefault();${openRow(d)}">${d.m?'📁':'🗂'} ${_e6(_dispKey(d.key))}</span>${d.title?` <span class="muted" style="font-size:10px;font-weight:400;">${_e6(d.title)}</span>`:''}</summary>
      ${BC.filter(c=>d.boards[c]).map(c=>`<div class="tree-board" onclick="openDetailModal('board','${_e6(d.boards[c])}')"><span>🔲 ${c} <span class="tree-model">${_e6(d.boards[c])}</span></span>
        <span class="dot ${_boardHasDocs(d.key,d.boards[c])?'dot-g':'dot-r'}"></span></div>`).join('')||'<div class="tree-board muted">基板未登録</div>'}
    </details>`).join('')||'<div class="muted" style="padding:10px;">該当なし</div>';

  document.getElementById('page-dashboard').innerHTML=`
  <div class="home-wrap">
    <aside class="home-tree">
      <div class="home-tree-head">機種管理</div>
      <div class="home-tree-body">${tree}</div>
      <div class="muted" style="font-size:10px;padding:8px 4px;"><span class="dot dot-g"></span> 資料あり　<span class="dot dot-r"></span> 資料未登録</div>
    </aside>
    <section class="home-main">
      ${_homeTodo(alerts,csTodo)}
      <div class="kpi-row">
        <div class="kpi"><div class="kpi-ic" style="background:#2563eb;">⚙️</div><div><div class="kpi-l">稼働中の機種数</div><div class="kpi-v">${active}</div></div></div>
        <div class="kpi"><div class="kpi-ic" style="background:#0f766e;">📅</div><div><div class="kpi-l">納期直前（7日以内）</div><div class="kpi-v">${near}</div></div></div>
        <div class="kpi" style="cursor:pointer;" onclick="showPage('csheets')"><div class="kpi-ic" style="background:#b45309;">📑</div><div><div class="kpi-l">構成表 要依頼</div><div class="kpi-v">${csTodo.length}</div></div></div>
        <div class="kpi"><div class="kpi-ic" style="background:#15803d;">🗂</div><div><div class="kpi-l">今後の販売予定機種</div><div class="kpi-v">${planned}</div></div></div>
      </div>
      <div class="pt-bar">
        <span style="font-size:12px;font-weight:800;color:var(--text-sub);">状態</span>
        ${['','進行中','量産前','量産中','量産終了','期限超過・納期直前','計画（機種DB）','販売済（機種DB）'].map(g=>_ptChip(g||'すべて',ns(g),_homeStatus===g,`_homeStatus='${g}';_homeLimit=200;renderHome()`)).join('')}
      </div>
      <div class="pt-bar">
        <span style="font-size:12px;font-weight:800;color:var(--text-sub);">種別</span>
        ${_ptChip('すべて',n(''),!_homeKind,"_homeKind='';_homeLimit=200;renderHome()")}
        ${_ptChip('🎰 パチンコ',n('パチンコ'),_homeKind==='パチンコ',"_homeKind='パチンコ';_homeLimit=200;renderHome()")}
        ${_ptChip('🎲 スロット',n('スロット'),_homeKind==='スロット',"_homeKind='スロット';_homeLimit=200;renderHome()")}
        <input id="home-q" class="pt-in" style="flex:1;min-width:200px;" placeholder="機種・タイトル・担当・基板品番で検索..." value="${_e6(_homeTerm)}"
          oninput="clearTimeout(window._hT);window._hT=setTimeout(()=>{_homeTerm=this.value;_homeLimit=200;renderHome();const el=document.getElementById('home-q');el.focus();el.setSelectionRange(el.value.length,el.value.length);},250)">
        <select class="pt-in" onchange="_homeScope=this.value;renderHome()">
          <option value="active"${_homeScope==='active'?' selected':''}>進行中・予定の機種</option><option value="all"${_homeScope==='all'?' selected':''}>全機種（過去機種を含む）</option></select>
        <label style="font-size:12px;display:flex;align-items:center;gap:4px;"><input type="checkbox" ${_homeCsOnly?'checked':''} onchange="_homeCsOnly=this.checked;renderHome()"> 構成表 要依頼のみ</label>
        <label style="font-size:12px;display:flex;align-items:center;gap:4px;"><input type="checkbox" ${_homeRegOnly?'checked':''} onchange="_homeRegOnly=this.checked;renderHome()"> 登録機種のみ</label>
        <button class="btn btn-sm" onclick="_ptPrint('機種一覧','home-pt')">🖨 印刷</button>
        <button class="btn btn-sm" style="color:#16a34a;border-color:#16a34a;" onclick="_homeCsv()">📥 CSV</button>
        <button class="btn btn-sm" onclick="openImportModal()">📥 取り込み</button>
      </div>
      <div class="pt-info">${showC?'すべての得意先':'<b>'+_e6(_custName(_curCust()))+'</b>'}：${list.length}機種（うち構成表の要依頼 <b style="color:#dc2626;">${list.filter(d=>d.csAlert).length}</b>）。黄色が販売時期（生産計画に無い登録機種は量産出荷日）。台数の * は定例打ち合わせの予測台数（中）。行クリック（または編集）で機種詳細設定を開き、タイトル・日程・基板などを入力できます。</div>
      <div class="pt-wrap" id="home-pt"><table class="pt"><thead>
        <tr><th rowspan="2">機種</th>${showC?'<th rowspan="2">得意先</th>':''}<th rowspan="2">タイトル</th><th rowspan="2">担当</th>
          <th colspan="3">生産計画</th><th colspan="${BC.length+1}">枠・使用基板</th><th colspan="3">構成表</th>
          <th rowspan="2">状態</th><th rowspan="2">進行</th><th rowspan="2"></th></tr>
        <tr><th class="pt-cur">販売時期</th><th>部品集約</th><th>台数</th><th>枠</th>${BC.map(c=>`<th>${c}</th>`).join('')}<th>量産準備用</th><th>見本機用</th><th>量産用</th></tr>
      </thead><tbody>${body||`<tr><td colspan="${NC}" class="c same" style="padding:20px;">該当する機種がありません</td></tr>`}</tbody></table></div>
      ${list.length>_homeLimit?`<div style="text-align:center;margin:8px;"><button class="btn btn-sm" onclick="_homeLimit+=300;renderHome()">さらに表示（残り ${list.length-_homeLimit}機種）</button></div>`:''}
    </section>
  </div>`;
}
function _homeCsv(){
  const BC=['M','D','DE','E','C'];
  _ptCsvDownload('機種一覧',['得意先','区分','機種','登録','タイトル','担当','販売時期','部品集約','台数','枠'].concat(BC).concat(['量産準備用','見本機用','量産用','状態','進行']),
    (window._homeList||[]).map(d=>[_custName(d.cust),d.kind,_dispKey(d.key),d.m?'登録':'',d.title,d.person,d.due,d.agg,d.qty,d.frame].concat(BC.map(c=>d.boards[c]||'')).concat(d.cs.map(c=>c.s.label+(c.s.rec.req?' 依頼'+c.s.rec.req:'')+(c.s.rec.got?' 取得'+c.s.rec.got:''))).concat([d.st.label,d.prog])));
}

/* ---------- 資料一覧 ---------- */
let _docsTerm='', _docsType='';
function _collectDocs(){
  const out=[];
  const add=(name,type,owner,date,url,cust)=>{if(url)out.push({name:name||'(無題)',type,owner:owner||'—',date:date||'',url,cust:cust||''});};
  (state.importArchive||[]).forEach(a=>add(a.fileName,'取込資料: '+a.category,'—',a.docDate||String(a.uploadedAt||'').slice(0,10),a.url,a.customer||'fuji'));
  Object.keys(state.driveFiles||{}).forEach(mid=>(state.driveFiles[mid]||[]).forEach(f=>add(f.fileName,'機種添付',mid,String(f.uploadedAt||'').slice(0,10),f.url,_machineCust(mid))));
  Object.keys(state.boardDriveFiles||{}).forEach(md=>(state.boardDriveFiles[md]||[]).forEach(f=>add(f.fileName,'基板添付',md,String(f.uploadedAt||'').slice(0,10),f.url)));
  Object.keys(state.boardDocs||{}).forEach(mid=>{
    const d=state.boardDocs[mid]||{};
    add('組立費見積書','組立費見積書',mid,'',d.assemblyQuoteUrl);
    BOARD_TYPE_DEFS.forEach(bt=>{const b=d[bt.key];if(!b)return;
      add(`${bt.label} ${b.model||''} 仕様書`,'仕様書',mid,'',b.specUrl);
      add(`${bt.label} ${b.model||''} PCB見積`,'PCB見積',mid,'',b.pcbUrl);});
  });
  Object.keys(state.configSheets||{}).forEach(k=>{const r=state.configSheets[k]||{};
    [['prep','量産準備用'],['sample','見本機用'],['mass','量産用']].forEach(([kk,l])=>{const x=r[kk];if(x&&x.url)add(`${l} 構成表`,'構成表',_dispKey(k),x.got||x.req,x.url,_keyCust(k));});});
  MACHINES.forEach(m=>getEstimatesForMachine(m.id).forEach(e=>{
    add(`見積書 ${e.quoteNo||''}`.trim(),'見積書',m.id,e.quoteDate,e.url,_machineCust(m.id));
    add(`注文書 ${e.orderNo||''}`.trim(),'注文書',m.id,e.poDate,e.orderUrl,_machineCust(m.id));
  }));
  return out.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
}
function renderDocs(){
  const all=_collectDocs().filter(d=>!d.cust||_custMatch(d.cust));
  const showC=_curCust()==='all';
  const t=_docsTerm.trim().toLowerCase();
  const base=all.filter(d=>!t||(d.name+' '+d.owner+' '+d.type).toLowerCase().includes(t));
  const types=[...new Set(all.map(d=>d.type))].sort();
  const list=base.filter(d=>!_docsType||d.type===_docsType).sort((a,b)=>a.type.localeCompare(b.type)||String(b.date).localeCompare(String(a.date)));
  window._docsList=list;
  let body='',last='';
  list.forEach(d=>{
    if(d.type!==last){last=d.type;body+=`<tr class="pt-sec"><td colspan="6">■ ${_e6(d.type)}（${list.filter(x=>x.type===d.type).length}件）</td></tr>`;}
    body+=`<tr><td class="name"><a class="q" href="${_e6(d.url)}" target="_blank" rel="noopener">📄 ${_e6(d.name)}</a></td>
      <td>${_e6(d.cust?_custName(d.cust):'共通')}</td><td>${_e6(d.owner)}</td><td class="c pt-cur">${_e6(d.date||'')||'<span class="same">—</span>'}</td>
      <td class="spec">${_e6(d.type)}</td>
      <td class="c"><a class="btn btn-sm" style="padding:1px 8px;" href="${_e6(d.url)}" target="_blank" rel="noopener">開く</a></td></tr>`;
  });
  document.getElementById('page-docs').innerHTML=`
    <div class="pt-bar">
      ${_ptChip('すべて',base.length,!_docsType,"_docsType='';renderDocs()")}
      ${types.map(x=>_ptChip(_e6(x),base.filter(d=>d.type===x).length,_docsType===x,`_docsType='${_e6(x)}';renderDocs()`)).join('')}
    </div>
    <div class="pt-bar">
      <input id="docs-q" class="pt-in" style="flex:1;min-width:220px;" placeholder="資料名・機種・基板・種別で検索..." value="${_e6(_docsTerm)}"
        oninput="clearTimeout(window._dT);window._dT=setTimeout(()=>{_docsTerm=this.value;renderDocs();const el=document.getElementById('docs-q');el.focus();el.setSelectionRange(el.value.length,el.value.length);},250)">
      <button class="btn btn-sm" onclick="_ptPrint('資料一覧','docs-pt')">🖨 印刷</button>
      <button class="btn btn-sm" style="color:#16a34a;border-color:#16a34a;" onclick="_ptCsvDownload('資料一覧',['種別','資料名','得意先','機種/基板','日付','URL'],(window._docsList||[]).map(d=>[d.type,d.name,d.cust?_custName(d.cust):'共通',d.owner,d.date,d.url]))">📥 CSV</button>
      <button class="btn btn-primary btn-sm" onclick="openImportModal()">📥 外部データ取り込み</button>
    </div>
    <div class="pt-info">${list.length}件。黄色が資料の日付（取込資料はファイル名の日付）。資料名クリックで開きます。</div>
    <div class="pt-wrap" id="docs-pt"><table class="pt"><thead>
      <tr><th>資料名</th><th>得意先</th><th>機種 / 基板</th><th class="pt-cur">日付</th><th>種別</th><th></th></tr></thead>
      <tbody>${body||'<tr><td colspan="6" class="c same" style="padding:20px;">資料がありません。「外部データ取り込み」から追加できます。</td></tr>'}</tbody></table></div>`;
}

/* ---------- 外部データ取り込み（モーダル） ---------- */
// 既存の取込処理は管理コンソール上のプレビュー領域を使うため、
// 管理コンソールを開いてから該当のファイル選択を起動する
function _importVia(inputId){
  closeImportModal();
  showPage('admin');
  const el=document.getElementById(inputId);
  if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.click();}
}
function _importOtherDocs(ev){
  Array.from(ev.target.files||[]).forEach(f=>_archiveImportFile(f,_guessArchiveCategory(f.name),'外部データ取り込み'));
  ev.target.value='';
  setTimeout(()=>{if(document.getElementById('import-modal'))_renderImportHistory();},4000);
}
function _renderImportHistory(){
  const box=document.getElementById('import-history');
  if(!box)return;
  const list=(state.importArchive||[]).slice(0,10);
  box.innerHTML=list.length?`<table><thead><tr><th>ファイル名</th><th>種別</th><th>保存日時</th><th>状態</th></tr></thead><tbody>${list.map(a=>`<tr>
    <td><a href="${_e6(a.url)}" target="_blank" rel="noopener">${_e6(a.fileName)}</a></td><td style="font-size:12px;">${_e6(a.category)}</td>
    <td class="mono" style="font-size:12px;">${_e6(a.uploadedAt||'')}</td><td><span class="st st-green">保存済</span></td></tr>`).join('')}</tbody></table>`
    :'<div class="muted" style="padding:12px;text-align:center;">まだ取込履歴はありません</div>';
}
function openImportModal(){
  closeImportModal();
  const ov=document.createElement('div');
  ov.id='import-modal';ov.className='modal-overlay';ov.style.display='flex';

  ov.innerHTML=`<div class="modal" style="max-width:760px;width:94%;">
    <div class="modal-head" style="background:linear-gradient(90deg,#1e3a8a,#0f766e);color:#fff;">
      <span style="font-weight:700;">📥 外部データ取り込み</span>
      <button class="btn btn-sm" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.4);" onclick="closeImportModal()">✕</button></div>
    <div style="padding:16px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:10px 12px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;">
        <strong style="font-size:13px;">🏢 取り込み先の得意先</strong>
        <select class="pt-in" onchange="window._impCust=this.value">${_custOptions(_importCust())}</select>
        <span class="muted" style="font-size:11px;">生産計画表・HW構成一覧表・長納期計画PDFは藤商事の書式です。他社は「機種一覧Excel」か連携スプレッドシートで取り込めます。</span></div>
      <div class="imp-grid">
        <div class="imp-card"><div class="imp-t">1. Excelファイル</div><div style="font-size:30px;">📗</div>
          <button class="btn btn-sm" onclick="_importVia('excel-file-admin')">生産計画表（サン電子）</button>
          <button class="btn btn-sm" onclick="_importVia('hwspec-file-admin')">ハードウェア構成一覧表</button>
          <label class="btn btn-sm" style="cursor:pointer;">機種一覧Excel・CSV（1行=1機種／他社用）
            <input type="file" accept=".xlsx,.xls,.csv" style="display:none" onchange="handleGenericModelExcel(event)"></label></div>
        <div class="imp-card"><div class="imp-t">2. PDFファイル</div><div style="font-size:30px;">📕</div>
          <button class="btn btn-sm" onclick="_importVia('prodplan-pdf-file')">生産計画PDF（長納期部品）</button>
          <label class="btn btn-sm" style="cursor:pointer;">ハードウェア構成一覧表PDF（ぱちんこ・回胴）
            <input type="file" multiple accept=".pdf" style="display:none" onchange="handleHwSpecPDF(event)"></label>
          <label class="btn btn-sm" style="cursor:pointer;">見積書・図面・その他資料（保存のみ）
            <input type="file" multiple accept=".pdf,.xlsx,.xls" style="display:none" onchange="_importOtherDocs(event)"></label></div>
      </div>
      <div class="imp-card" style="margin-top:12px;flex-direction:row;align-items:center;justify-content:space-between;">
        <div><div class="imp-t">📤 スプレッドシートへ書き出し</div><div class="muted" style="font-size:11px;">機種DB・登録機種・構成表・取込履歴・得意先を「DB_」シートに書き出します</div></div>
        <div style="display:flex;gap:6px;"><button class="btn btn-sm" onclick="_syncFromSheet(this)">シートから反映</button>
        <button class="btn btn-primary btn-sm" onclick="_syncToSheet(this)">書き出す</button></div></div>
      <div class="imp-card" style="margin-top:12px;"><div class="imp-t">3. 連携スプレッドシート（機種DBへ取込）</div>
        <div id="dbsheet-box" style="width:100%;"></div></div>
      <div class="muted" style="font-size:11px;margin:8px 0 14px;">取り込んだデータは機種コード単位で「機種DB」に統合され、機種一覧・構成表に反映されます。原本はDrive「営業進捗管理_取込資料」に自動保存されます。</div>
      <div style="font-weight:700;font-size:13px;margin-bottom:6px;">インポート履歴</div>
      <div id="import-history" class="table-wrap" style="margin:0;"></div>
    </div></div>`;
  document.body.appendChild(ov);
  _renderImportHistory();
  if(typeof _renderDbSheetBox==='function')_renderDbSheetBox();
}
// 他社用: 1行=1機種のExcel/CSVを機種DBへ（列名で自動対応付け）
function handleGenericModelExcel(ev){
  const f=ev.target.files[0]; ev.target.value=''; if(!f)return;
  const cid=_importCust();
  _archiveImportFile(f,'機種一覧','機種一覧Excel取込');
  _loadXLSX(function(){
    const isCsv=/\.csv$/i.test(f.name);
    const rd=new FileReader();
    rd.onload=e=>{
      try{
        let wb;
        if(isCsv){
          // CSVは文字コードを判定して文字列で読む（UTF-8で化ける場合はShift_JIS）
          const buf=new Uint8Array(e.target.result);
          let txt=new TextDecoder('utf-8').decode(buf);
          if(txt.includes('�'))txt=new TextDecoder('shift_jis').decode(buf);
          wb=XLSX.read(txt.replace(/^﻿/,''),{type:'string',raw:true});
        }else wb=XLSX.read(e.target.result,{type:'binary',cellDates:true});
        const sheets=wb.SheetNames.map(n=>({name:n,values:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:'',raw:false})}));
        window._impCust=cid;
        const st=_mdbFromSheetValues(f.name,sheets);
        if(st.added||st.updated){_saveModelDB('🗂 機種DB '+_statMsg(_custName(cid)+' 機種一覧Excel',st));showToast('✅ 機種DB '+_statMsg(_custName(cid),st));}
        else showToast('⚠️ 機種の列が見つかりませんでした（見出しに「機種名」「機種コード」等が必要です）',6000);
        _afterMdbImport();
      }catch(err){showToast('⚠️ 読み込みエラー: '+err.message);}
    };
    if(isCsv)rd.readAsArrayBuffer(f);else rd.readAsBinaryString(f);
  });
}
function _syncToSheet(btn){
  if(typeof google==='undefined'||!google.script){showToast('⚠️ GAS環境でのみ実行できます');return;}
  if(btn){btn.disabled=true;btn.textContent='書き出し中...';}
  google.script.run
    .withSuccessHandler(res=>{
      if(btn){btn.disabled=false;btn.textContent='書き出す';}
      try{const r=JSON.parse(res);
        showToast(`✅ 書き出し完了: 機種DB ${r.counts['DB_機種']}件 / 登録機種 ${r.counts['DB_登録機種']}件 / 構成表 ${r.counts['DB_構成表']}件`,5000);
        window.open(r.url,'_blank');
      }catch(e){showToast('⚠️ 書き出し結果を読み取れませんでした');}
    })
    .withFailureHandler(err=>{if(btn){btn.disabled=false;btn.textContent='書き出す';}showToast('⚠️ 書き出し失敗: '+err.message,6000);})
    .syncToSpreadsheet();
}
function _syncFromSheet(btn){
  if(typeof google==='undefined'||!google.script){showToast('⚠️ GAS環境でのみ実行できます');return;}
  if(btn){btn.disabled=true;btn.textContent='反映中...';}
  google.script.run
    .withSuccessHandler(res=>{
      if(btn){btn.disabled=false;btn.textContent='シートから反映';}
      let r;try{r=JSON.parse(res);}catch(e){showToast('⚠️ 結果を読み取れませんでした');return;}
      if(!r.success){showToast('⚠️ '+r.error,6000);return;}
      if(!r.changed.length){showToast('変更はありませんでした');return;}
      showToast('✅ シートから反映: '+r.changed.join(' / ')+'（画面を再読み込みします）',4000);
      setTimeout(()=>location.reload(),1500);
    })
    .withFailureHandler(err=>{if(btn){btn.disabled=false;btn.textContent='シートから反映';}showToast('⚠️ 反映失敗: '+err.message,6000);})
    .syncFromSpreadsheet();
}
function closeImportModal(){const m=document.getElementById('import-modal');if(m)m.remove();}
