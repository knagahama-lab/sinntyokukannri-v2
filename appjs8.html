<script>
/* ============================================================
   得意先（顧客）対応
   藤商事に加え、コナミアミューズメント・エキサイト等の他社を扱う。
   ・得意先マスタ: state.config.customers [{id,name,kw:[宛先照合キーワード]}]
   ・表示中の得意先: ブラウザごとに記憶（localStorage）。all = すべて
   ・機種DBのキー: 藤商事は従来どおり機種コードのみ、他社は「得意先ID:機種コード」
     （他社で同じ機種コードがあっても衝突しない）
   ・登録機種の得意先: state.machineExtra[機種].customer（未設定=藤商事）
   ※ このファイルの文字列にスラッシュ2つやスラッシュ+アスタリスクを書かないこと
============================================================ */
const DEFAULT_CUSTOMERS=[
  {id:'fuji',name:'藤商事',kw:['藤商事']},
  {id:'konami',name:'コナミアミューズメント',kw:['コナミ','KONAMI','Konami']},
  {id:'excite',name:'エキサイト',kw:['エキサイト','EXCITE','Excite']},
];
function _e8(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function _customers(){
  if(!Array.isArray(state.config.customers)||!state.config.customers.length)state.config.customers=JSON.parse(JSON.stringify(DEFAULT_CUSTOMERS));
  return state.config.customers;
}
function _cust(id){return _customers().find(c=>c.id===id)||{id:id||'fuji',name:id||'藤商事',kw:[id||'藤商事']};}
function _custName(id){return _cust(id).name;}
function _curCust(){try{return localStorage.getItem('curCustomer')||'all';}catch(e){return 'all';}}
function _custMatch(cid){const c=_curCust();return c==='all'||c===(cid||'fuji');}
// 取り込み先の得意先（取込画面で選択。未選択なら表示中の得意先、すべて表示中なら藤商事）
function _importCust(){
  if(window._impCust)return window._impCust;
  const c=_curCust();return c==='all'?'fuji':c;
}
function _ikey(raw,cid){
  const k=_mkey(raw); if(!k)return '';
  cid=cid||_importCust();
  return cid==='fuji'?k:cid+':'+k;
}
function _keyCust(key){
  const i=String(key).indexOf(':');
  if(i>0){const p=key.slice(0,i);if(_customers().some(c=>c.id===p))return p;}
  const db=state.modelDB[key];return (db&&db.customer)||'fuji';
}
function _dispKey(key){
  const i=String(key).indexOf(':');
  return i>0&&_customers().some(c=>c.id===key.slice(0,i))?key.slice(i+1):key;
}
function _machineCust(id){const ex=state.machineExtra&&state.machineExtra[id];return (ex&&ex.customer)||'fuji';}
function _machineKey(m){const ex=state.machineExtra&&state.machineExtra[m.id];if(ex&&ex.dbKey)return ex.dbKey;const c=_machineCust(m.id);const k=_mkey(m.id)||m.id;return c==='fuji'?k:c+':'+k;}
function _custMachines(){return MACHINES.filter(m=>_custMatch(_machineCust(m.id)));}

/* ---------- 上部の得意先セレクタ ---------- */
function _renderCustSelect(){
  const sel=document.getElementById('cust-select'); if(!sel)return;
  const cur=_curCust();
  sel.innerHTML=`<option value="all"${cur==='all'?' selected':''}>🏢 すべての得意先</option>`
    +_customers().map(c=>`<option value="${_e8(c.id)}"${cur===c.id?' selected':''}>🏢 ${_e8(c.name)}</option>`).join('')
    +'<option disabled>──────────</option><option value="__add">＋ 得意先を追加…</option><option value="__manage">⚙ 得意先の管理…</option>';
}
function setCurrentCustomer(v){
  if(v==='__add'){addCustomer();_renderCustSelect();return;}
  if(v==='__manage'){openCustomerManager();_renderCustSelect();return;}
  try{localStorage.setItem('curCustomer',v);}catch(e){}
  window._impCust=null;
  _renderCustSelect();
  renderPage(currentPage);
}
function _newCustId(name){
  let base=String(name).replace(/株式会社|\(株\)|（株）/g,'').trim();
  let id='c'+Date.now().toString(36);
  if(/^[A-Za-z0-9]+$/.test(base))id=base.toLowerCase().slice(0,12);
  while(_customers().some(c=>c.id===id))id+='x';
  return id;
}
function addCustomer(){
  const name=(prompt('追加する得意先名を入力してください（例: 大一商会）')||'').trim();
  if(!name)return;
  if(_customers().some(c=>c.name===name)){showToast('⚠️ 既に登録されています');return;}
  const c={id:_newCustId(name),name,kw:[name.replace(/株式会社|\(株\)|（株）/g,'').trim()]};
  _customers().push(c);
  addLog(`🏢 得意先を追加: ${name}`);saveToGAS();
  try{localStorage.setItem('curCustomer',c.id);}catch(e){}
  showToast(`✅ 得意先「${name}」を追加しました`);
  renderPage(currentPage);
}
function _custUsage(id){
  const m=MACHINES.filter(x=>_machineCust(x.id)===id).length;
  const d=Object.keys(state.modelDB||{}).filter(k=>_keyCust(k)===id).length;
  return {m,d};
}
function openCustomerManager(){
  const rows=_customers().map((c,i)=>{const u=_custUsage(c.id);return `<tr>
    <td><input id="cm-name-${i}" value="${_e8(c.name)}" style="width:100%;padding:4px 6px;border:1px solid var(--border);border-radius:4px;font-size:12px;"></td>
    <td><input id="cm-kw-${i}" value="${_e8((c.kw||[]).join(','))}" style="width:100%;padding:4px 6px;border:1px solid var(--border);border-radius:4px;font-size:12px;"></td>
    <td class="num" style="font-weight:500;">${u.m} ／ ${u.d}</td>
    <td class="c">${c.id==='fuji'||u.m||u.d?'<span class="pt-muted">—</span>':`<button class="btn btn-sm" onclick="removeCustomer(${i})">削除</button>`}</td></tr>`;}).join('');
  _overlay('cust-manager','🏢 得意先の管理',`
    <div class="pt-info">「宛先キーワード」は見積管理の宛先と照合して、見積書・注文書を得意先ごとに振り分けるのに使います（カンマ区切り）。</div>
    <div class="pt-wrap" style="max-height:none;"><table class="pt"><thead><tr><th>得意先名</th><th>宛先キーワード</th><th>登録機種／機種DB</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div style="display:flex;gap:6px;margin-top:12px;"><button class="btn btn-sm" onclick="document.getElementById('cust-manager').remove();addCustomer();">＋ 得意先を追加</button>
      <span style="flex:1;"></span><button class="btn btn-primary btn-sm" onclick="saveCustomerManager()">保存</button></div>`,640);
}
function saveCustomerManager(){
  _customers().forEach((c,i)=>{
    const n=document.getElementById('cm-name-'+i),k=document.getElementById('cm-kw-'+i);
    if(n&&n.value.trim())c.name=n.value.trim();
    if(k)c.kw=k.value.split(/[,、]/).map(s=>s.trim()).filter(Boolean);
  });
  saveToGAS();addLog('🏢 得意先マスタを更新');
  const ov=document.getElementById('cust-manager');if(ov)ov.remove();
  _renderCustSelect();renderPage(currentPage);showToast('✅ 得意先を保存しました');
}
function removeCustomer(i){
  const c=_customers()[i];if(!c)return;
  if(!confirm(`得意先「${c.name}」を削除しますか？`))return;
  _customers().splice(i,1);saveToGAS();
  if(_curCust()===c.id){try{localStorage.setItem('curCustomer','all');}catch(e){}}
  openCustomerManager();_renderCustSelect();
}
function _custOptions(sel){return _customers().map(c=>`<option value="${_e8(c.id)}"${c.id===sel?' selected':''}>${_e8(c.name)}</option>`).join('');}

/* ---------- 見積・注文の振り分け（appjs1 の同名関数を置き換え） ---------- */
// 宛先が別の得意先のキーワードに一致する見積は、その機種に紐づけない
function getEstimatesForMachine(machineId){
  if(!state.linkageData)return[];
  const all=(state.linkageData.estimates||state.linkageData.quotes||[]);
  const mid=String(machineId).trim().toUpperCase();
  const mine=_machineCust(machineId);
  return all.filter(e=>{
    const eid=String(e.id||e.machineId||'').trim().toUpperCase();
    if(!(eid===mid||eid.startsWith(mid)||mid.startsWith(eid)))return false;
    const ec=String(e.customer||e.client||'');
    if(!ec)return true;
    const owner=_customers().find(c=>(c.kw&&c.kw.length?c.kw:[c.name]).some(k=>k&&ec.includes(k)));
    return !owner||owner.id===mine;
  });
}

/* ============================================================
   機種詳細設定（機種一覧の行クリックで開く編集画面）
   ・登録機種: 担当/状態/台数/適合/ROM/日程/備考 は従来のデータへ直接保存
   ・タイトル/種別/ブランド/販売時期/部品集約/使用基板 は「手入力の上書き」
     state.modelOverrides[キー] に保存（取込データを再取込しても消えない）
   ・機種DBのみの機種は、状態を選んで保存すると登録機種になる
============================================================ */
if(!state.modelOverrides)state.modelOverrides={};
const _ED_SCH=[['sampleImpl','見本機実装'],['sampleAssy','見本機組立'],['sampleShip','見本機出荷'],['prodImpl','量産実装'],['prodAssy','量産組立'],['prodShip','量産出荷']];
const _ED_BC=['M','D','DE','E','C'];

function openMachineEditor(key){
  const m=_machineForKey(key);
  const raw=state.modelDB[key]||{};
  const v=_mdbView(key)||{};
  const ov=state.modelOverrides[key]||{};
  const sc=m?(state.schedules[m.id]||{}):{};
  const boards=typeof _rowBoards==='function'?_rowBoards({key,m,db:v}):(v.boards||{});
  const cid=m?_machineCust(m.id):_keyCust(key);
  const inp=(id,val,type,ph)=>`<input id="me-${id}" type="${type||'text'}" value="${_e8(val||'')}" placeholder="${_e8(ph||'')}" class="me-in">`;
  const fld=(label,html,hint)=>`<label class="me-f"><span>${label}${hint?` <em>${_e8(hint)}</em>`:''}</span>${html}</label>`;
  const src=(f)=>raw[f]&&ov[f]!=null&&ov[f]!==raw[f]?'取込値: '+raw[f]:'';
  const stOpts=(m?'':'<option value="">（未登録・機種DBのみ）</option>')+['量産前','量産中','量産終了'].map(x=>`<option${m&&state.statuses[m.id]===x?' selected':''}>${x}</option>`).join('');
  const csRows=CS_KINDS.map(x=>{const r=_csPeek(key,x.k);const s=_csState(key,x.k);return `<tr><td class="name">${x.label}</td>
    <td class="c"><span class="st ${s.cls}" style="padding:0 6px;">${_e8(s.label)}</span></td><td class="c pt-cur">${_e8(s.due||'—')}</td>
    <td><input id="me-cs-${x.k}-req" type="date" value="${_e8(r.req||'')}" class="me-in"></td>
    <td><input id="me-cs-${x.k}-got" type="date" value="${_e8(r.got||'')}" class="me-in"></td>
    <td><input id="me-cs-${x.k}-url" type="text" value="${_e8(r.url||'')}" placeholder="構成表のURL" class="me-in"></td></tr>`;}).join('');
  _overlay('machine-editor',`✏️ 機種詳細設定 — ${_e8(_dispKey(key))}　<span style="font-size:11px;opacity:.85;">${_e8(_custName(cid))}${m?'／登録機種':'／機種DB'}</span>`,`
    <style>.me-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 12px;}
      .me-f{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:700;color:var(--text-sub);}
      .me-f em{font-style:normal;font-weight:400;color:#94a3b8;}
      .me-in{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;box-sizing:border-box;font-weight:400;color:#111;}
      .me-h{font-size:12px;font-weight:800;margin:16px 0 8px;padding:4px 8px;background:#334155;color:#fff;border-radius:4px;}
      @media (max-width:700px){.me-grid{grid-template-columns:1fr 1fr;}}</style>
    <div class="me-h">■ 基本情報</div>
    <div class="me-grid">
      ${fld('得意先',`<select id="me-cust" class="me-in">${_custOptions(cid)}</select>`)}
      ${fld('タイトル',inp('title',v.title),src('title'))}
      ${fld('状態',`<select id="me-status" class="me-in">${stOpts}</select>`,m?'':'選ぶと登録機種になります')}
      ${fld('担当',inp('person',m?m.person:v.person))}
      ${fld('種別',`<select id="me-kind" class="me-in">${['','パチンコ','スロット'].map(x=>`<option value="${x}"${(v.kind||'')===x?' selected':''}>${x||'（未設定）'}</option>`).join('')}</select>`)}
      ${fld('販売ブランド',inp('brand',v.brand),src('brand'))}
      ${fld('量産台数',inp('qty',m?m.prodQty:v.salesQty))}
      ${fld('適合',inp('compliance',m?m.compliance:''))}
      ${fld('ROM',inp('rom',m?m.rom:''))}
    </div>
    <div class="me-h">■ 生産計画・日程</div>
    <div class="me-grid">
      ${fld('販売時期',inp('salesDate',v.salesDate,'date'),src('salesDate'))}
      ${fld('部品集約時期',inp('aggDate',v.aggDate,'date'),src('aggDate'))}
      <div></div>
      ${_ED_SCH.map(([k,l])=>fld(l,inp('sch-'+k,sc[k]||(m?m[k]:''),'date'))).join('')}
    </div>
    <div class="me-h">■ 使用基板</div>
    <div class="me-grid" style="grid-template-columns:repeat(5,minmax(0,1fr));">
      ${_ED_BC.map(c=>fld(c,inp('b-'+c,boards[c]))).join('')}
    </div>
    <div class="me-h">■ 構成表</div>
    <div class="pt-wrap" style="max-height:none;"><table class="pt"><thead><tr><th>構成表</th><th>状態</th><th class="pt-cur">依頼期限</th><th>依頼日</th><th>取得日</th><th>URL</th></tr></thead><tbody>${csRows}</tbody></table></div>
    <div class="me-h">■ 備考</div>
    <textarea id="me-notes" class="me-in" rows="3">${_e8(m?(state.notes[m.id]||''):(ov.notes||''))}</textarea>
    <div style="display:flex;gap:6px;margin-top:14px;flex-wrap:wrap;">
      <button class="btn btn-sm" onclick="document.getElementById('machine-editor').remove();${m?`openDetailModal('machine','${_e8(m.id)}')`:`openModelInfo('${_e8(key)}')`}">📇 図鑑・取込データを見る</button>
      <span style="flex:1;"></span>
      <button class="btn btn-sm" onclick="document.getElementById('machine-editor').remove()">キャンセル</button>
      <button class="btn btn-primary btn-sm" onclick="saveMachineEditor('${_e8(key)}')">💾 保存</button>
    </div>`,820);
}

function saveMachineEditor(key){
  const g=id=>{const el=document.getElementById('me-'+id);return el?String(el.value).trim():'';};
  let m=_machineForKey(key);
  const raw=state.modelDB[key]||{};
  const newCust=g('cust')||'fuji';
  const status=g('status');
  // 機種DBのみ → 状態を選んだら登録機種にする
  if(!m&&status){
    let id=_dispKey(key);
    if(MACHINES.some(x=>x.id===id))id=id+'_'+newCust;
    m={id,person:'',compliance:'',prodQty:'',rom:'',sampleImpl:null,sampleAssy:null,sampleShip:null,prodImpl:null,prodAssy:null,prodShip:null,boards:[],notes:''};
    MACHINES.push(m);
    if(!state.eco[id])state.eco[id]={collection:0,disassembly:0,e_inspect:0,snb_inspect:0,assembly:0,delivered:0,newParts:0};
    _getExtra(id).dbKey=key;_getExtra(id).customer=_keyCust(key);
    addLog(`🗂 ${_dispKey(key)} を登録機種に追加`);
  }
  // 手入力の上書き（取込値と同じなら上書きしない）
  const ov=Object.assign({},state.modelOverrides[key]||{});
  const setOv=(f,val)=>{if(val&&val!==(raw[f]||''))ov[f]=val;else delete ov[f];};
  setOv('title',g('title'));setOv('kind',g('kind'));setOv('brand',g('brand'));
  setOv('salesDate',g('salesDate'));setOv('aggDate',g('aggDate'));
  const rb=raw.boards||{};const ob={};
  _ED_BC.forEach(c=>{const val=g('b-'+c);if(val&&val!==(rb[c]||''))ob[c]=val;});
  if(Object.keys(ob).length)ov.boards=ob;else delete ov.boards;
  if(m){
    m.person=g('person');m.prodQty=g('qty');m.compliance=g('compliance');m.rom=g('rom');
    state.statuses[m.id]=status||state.statuses[m.id]||'量産前';
    const sc=state.schedules[m.id]=state.schedules[m.id]||{};
    _ED_SCH.forEach(([k])=>{const val=g('sch-'+k)||null;sc[k]=val;m[k]=val;});
    state.notes[m.id]=document.getElementById('me-notes').value;
    delete ov.person;delete ov.salesQty;delete ov.notes;
  }else{
    setOv('person',g('person'));setOv('salesQty',g('qty'));
    const nt=document.getElementById('me-notes').value;if(nt)ov.notes=nt;else delete ov.notes;
  }
  // 構成表
  CS_KINDS.forEach(x=>{
    const req=g('cs-'+x.k+'-req'),got=g('cs-'+x.k+'-got'),url=g('cs-'+x.k+'-url');
    const cur=_csPeek(key,x.k);
    if(req||got||url||cur.req||cur.got||cur.url){const r=_csRec(key,x.k);r.req=req;r.got=got;r.url=url;}
  });
  if(Object.keys(ov).length)state.modelOverrides[key]=ov;else delete state.modelOverrides[key];
  // 得意先の変更（登録機種はキーが変わるので上書き・構成表も移す）
  if(m&&newCust!==_machineCust(m.id)){
    const ex=_getExtra(m.id);ex.customer=newCust;delete ex.dbKey;
    const nk=_machineKey(m);
    if(nk!==key){
      if(state.modelOverrides[key]){state.modelOverrides[nk]=state.modelOverrides[key];delete state.modelOverrides[key];}
      if(state.configSheets[key]){state.configSheets[nk]=state.configSheets[key];delete state.configSheets[key];}
    }
  }
  addLog(`✏️ ${_dispKey(key)} の詳細を更新`);
  saveToGAS(`${_dispKey(key)} 詳細更新`);
  const ovl=document.getElementById('machine-editor');if(ovl)ovl.remove();
  showToast(`✅ ${_dispKey(key)} を保存しました`);
  renderPage(currentPage);
}

// 起動時: セレクタを描画
_renderCustSelect();
</script>
